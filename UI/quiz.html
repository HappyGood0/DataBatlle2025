<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Law Quiz</title>
  <link rel="stylesheet" href="style2.css" />
</head>
<body>

  <header class="main-header">
    <div class="logo">LegalQuizGPT</div>
    <div class="toggle-mode">🌙 Light/Dark</div>
  </header>

  <section class="quiz-container">
    
    <h2>Test Your Knowledge</h2>
    <div class="quiz-header">
      <div class="progress-bar"><div class="progress"></div></div>
    </div>
    
    <div class="question-box">
      <h3>Question 1/5</h3>
      <p class="question">What is the time limit for replying to a communication under Article 94(3) EPC?</p>
      
      <ul class="options">
        <li><button>A) Two months</button></li>
        <li><button>B) Four months</button></li>
        <li><button>C) Six months</button></li>
        <li><button>D) Eight months</button></li>
      </ul>
    </div>

    <button class="next-btn">Next Question</button>
  </section>

  <footer>
    <p>&copy; 2025 Patent AI Project</p>
  </footer>

  <script src="script2.js"></script>
</body>
</html>
